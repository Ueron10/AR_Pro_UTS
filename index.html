<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Marker-Based - UTS</title>
    <link rel="stylesheet" href="style.css">
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame GLTF Model Component -->
    <script src="https://unpkg.com/aframe-gltf-model-component/dist/aframe-gltf-model-component.min.js"></script>
    <!-- AR.js Library -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="info-overlay">
        <h1>AR Marker-Based - Need Some Space</h1>
        <p>Arahkan kamera ke marker Hiro untuk melihat model 3D</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <!-- Marker Hiro -->
        <a-marker preset="hiro">
            <!-- Need Some Space GLB Model -->
            <a-entity gltf-model="url(need_some_space.glb)"
                      position="0 0 0"
                      scale="0.5 0.5 0.5"
                      rotation="0 0 0">
            </a-entity>
            
            <!-- Lighting -->
            <a-light type="ambient" color="#BBB" intensity="0.5"></a-light>
            <a-light type="point" intensity="1.5" position="2 4 4"></a-light>
            <a-light type="directional" intensity="0.8" position="-5 10 5"></a-light>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
