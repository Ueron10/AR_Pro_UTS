<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Marker-Based - UTS</title>
    <link rel="stylesheet" href="style.css">
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- A-Frame GLTF Model Component -->
    <script src="https://unpkg.com/aframe-gltf-model-component/dist/aframe-gltf-model-component.min.js"></script>
    <!-- AR.js Library -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="info-overlay">
        <h1>AR Marker-Based - Porsche 911 Carrera 4S</h1>
        <p>Arahkan kamera ke marker Hiro untuk melihat model 3D</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Marker Hiro -->
        <a-marker preset="hiro">
            <!-- Porsche 911 Carrera 4S GLB Model -->
            <a-entity gltf-model="./free_porsche_911_carrera_4s.glb"
                      position="0 0.5 0"
                      scale="1.0 1.0 1.0"
                      rotation="0 -90 0">
            </a-entity>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
