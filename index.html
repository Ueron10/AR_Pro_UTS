<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Marker-Based - UTS</title>
    <link rel="stylesheet" href="style.css">
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js Library -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="info-overlay">
        <h1>AR Marker-Based</h1>
        <p>Arahkan kamera ke marker Hiro untuk melihat objek 3D</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <!-- Marker Hiro -->
        <a-marker preset="hiro">
            <!-- 3D Cube -->
            <a-box position="0 0.5 0" 
                  material="color: #4CC3D9; opacity: 0.8;" 
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            </a-box>
            
            <!-- 3D Sphere -->
            <a-sphere position="2 0.5 0" 
                      radius="0.5" 
                      material="color: #EF2D5E; opacity: 0.8;"
                      animation="property: position; to: 2 1 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
            </a-sphere>
            
            <!-- 3D Cylinder -->
            <a-cylinder position="-2 0.5 0" 
                        radius="0.3" 
                        height="1" 
                        material="color: #FFC65D; opacity: 0.8;"
                        animation="property: scale; to: 1 1.5 1; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
            </a-cylinder>
            
            <!-- Lighting -->
            <a-light type="ambient" color="#BBB"></a-light>
            <a-light type="point" intensity="1" position="2 4 4"></a-light>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
